server {
  listen 80;
  client_max_body_size 60m;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS, re-checked every few seconds: during a rolling update the backend containers change, and nginx must
  # follow them (a plain `proxy_pass http://backend` would resolve the name once at start-up and keep the old address).
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $backend http://backend:5000;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
